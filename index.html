<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#251a13">
  <title>Basileian Reader</title>
  <link rel="manifest" href="site.webmanifest?v=20261012-ui2">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=20261012-ui2">
  <link rel="stylesheet" href="style-additions.css?v=20261012-ui2">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="navToggle" class="icon-button nav-toggle" aria-label="Open navigation">☰</button>
      <button id="brandBtn" class="brand" type="button" aria-label="Open navigation">
        <span class="brand-mark" aria-hidden="true">β</span>
        <span class="brand-copy">
          <span class="brand-title">Basileian Reader</span>
          <span id="docSubtitle" class="brand-location">Jesus Tradition Canon</span>
        </span>
      </button>
      <nav class="tabbar" aria-label="Main sections">
        <button class="tab active" data-tab="reader">Reader</button>
        <button class="tab" data-tab="notes">Notes</button>
      </nav>
      <div class="top-actions">
        <button id="searchToggle" class="icon-button" aria-label="Search" aria-expanded="false" aria-controls="searchPanel">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="settingsToggle" class="icon-button settings-toggle" aria-label="Display settings" aria-expanded="false" aria-controls="settingsPanel">Aa</button>
      </div>
    </header>

    <section id="searchPanel" class="top-popover search-panel" aria-label="Search the canon" hidden>
      <div class="search-row">
        <input id="searchInput" class="control search-control" type="search" placeholder="Search words, phrases, references, or endnotes" aria-label="Search the canon">
        <button id="clearSearch" class="button ghost">Clear</button>
      </div>
      <div id="searchSummary" class="hint"></div>
      <div id="searchResults" class="search-results"></div>
    </section>

    <section id="settingsPanel" class="top-popover settings-panel" aria-label="Display settings" hidden>
      <div class="settings-group">
        <div class="settings-label">Footnotes</div>
        <button id="footnotesToggleBtn" class="setting-row active" aria-pressed="true">
          <span>Show markers in text</span><span class="switch" aria-hidden="true"></span>
        </button>
        <button id="footnoteTypeTnBtn" class="setting-row fn-type-btn active" data-fn-type="tn" aria-pressed="true">
          <span>Translator's notes <small>tn</small></span><span class="switch" aria-hidden="true"></span>
        </button>
        <button id="footnoteTypeSnBtn" class="setting-row fn-type-btn active" data-fn-type="sn" aria-pressed="true">
          <span>Study notes <small>sn</small></span><span class="switch" aria-hidden="true"></span>
        </button>
        <button id="footnoteTypeTcBtn" class="setting-row fn-type-btn active" data-fn-type="tc" aria-pressed="true">
          <span>Text-critical notes <small>tc</small></span><span class="switch" aria-hidden="true"></span>
        </button>
      </div>
      <div class="settings-group">
        <div class="settings-label">Appearance</div>
        <button id="themeToggle" class="setting-row" aria-pressed="false">
          <span>Dark mode</span><span class="switch" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <div class="main-layout">
      <aside id="sidebar" class="sidebar" aria-label="Reader navigation">
        <div class="sidebar-header">
          <strong>Navigate</strong>
          <button id="closeSidebar" class="icon-button close-sidebar" aria-label="Close navigation">×</button>
        </div>

        <nav class="tabbar sidebar-tabs" aria-label="Main sections">
          <button class="tab active" data-tab="reader">Reader</button>
          <button class="tab" data-tab="notes">Notes</button>
        </nav>

        <div class="sidebar-goto-section">
          <label class="field-label" for="gotoInput">Go to reference</label>
          <div class="inline-control">
            <input id="gotoInput" class="control" type="search" placeholder="Mark 4:21, John 20:24, Logion 54">
            <button id="gotoBtn" class="button">Go</button>
          </div>
          <p id="gotoMessage" class="hint"></p>
        </div>

        <label class="field-label" for="bookSelect">Book / source</label>
        <select id="bookSelect" class="control"></select>

        <select id="translationSelect" class="control" hidden></select>
        <span id="translationStatus" class="translation-status" hidden></span>

        <label class="field-label">Chapter</label>
        <div id="chapterList" class="chip-row" aria-label="Chapters"></div>

        <div id="passageList" class="passage-list" hidden></div>

        <div id="verseSection" class="sidebar-section" hidden>
          <div class="field-label">Verses</div>
          <div id="verseList" class="chip-row small" aria-label="Verses"></div>
        </div>
      </aside>
      <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

      <main class="content">
        <section id="readerTab" class="tab-panel active" aria-label="Reader">
          <article class="reader-card">
            <div class="reader-head">
              <button id="backBtn" class="button ghost back-btn" hidden>↩ Back</button>
              <div class="view-toggle" role="group" aria-label="View mode">
                <button id="viewChapterBtn" class="view-option" data-view="chapter" aria-pressed="false">Chapter</button>
                <button id="viewWitnessBtn" class="view-option" data-view="witness" aria-pressed="false">Witness</button>
              </div>
            </div>
            <div id="readerContent" class="reader-content" tabindex="-1"></div>
          </article>
          <nav class="reader-pager" aria-label="Previous and next">
            <button id="prevBtn" class="pager-btn">← Previous</button>
            <button id="nextBtn" class="pager-btn">Next →</button>
          </nav>
        </section>

        <section id="notesTab" class="tab-panel" aria-label="Notes">
          <div class="reader-card">
            <h2>Your highlights & notes</h2>
            <p class="muted">Highlights and notes are stored only in this browser on this device.</p>
            <div class="sync-bar">
              <button id="syncSettingsBtn" class="button secondary">Sync settings</button>
              <span id="syncStatus" class="hint sync-status"></span>
            </div>
            <div id="notesList" class="notes-list"></div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <div id="selectionMenu" class="selection-menu hidden" role="menu" aria-label="Selection options">
    <div id="selectionHeader" class="sm-selection-header">
      <span id="selectionRangeLabel" class="sm-range-label"></span>
      <button id="selectionCloseBtn" class="sm-close-btn" aria-label="Clear selection">×</button>
    </div>
    <p id="selectionHint" class="sm-hint" hidden>Tap more verses to add them · tap an end verse to drop it</p>
    <div class="sm-actions">
      <button id="menuHighlightBtn" class="sm-item">Highlight</button>
      <button id="menuNoteBtn" class="sm-item">Add note</button>
      <button id="menuEditHighlightBtn" class="sm-item" hidden>Edit note</button>
      <button id="menuRemoveHighlightBtn" class="sm-item" hidden>Remove</button>
      <button id="menuInterlinearBtn" class="sm-item">Interlinear</button>
      <button id="menuCommentaryBtn" class="sm-item" hidden>Commentary</button>
    </div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden" role="presentation"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button id="modalClose" class="icon-button" aria-label="Close">×</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalActions" class="modal-actions"></div>
  </div>

  <script src="data.js?v=20261012-ui2"></script>
  <script src="translations-module.js?v=20261012-ui2"></script>
  <script src="commentary-module.js?v=20261012-ui2"></script>
  <script src="nt-reader.js?v=20261012-ui2"></script>
  <script src="sync-module.js?v=20261012-ui2"></script>
  <script src="app.js?v=20261012-ui2"></script>
</body>
</html>
